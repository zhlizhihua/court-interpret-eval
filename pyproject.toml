[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evaleng"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []   # intentionally empty — conda owns the dependency list

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: loads Stanza; deselect with -m 'not slow'",
]