id: "st_en_es_006"
source_lang: "en"
target_lang: "es"
# Genre: personal letter entered as evidence (inmate to family). Register: LOW (colloquial, tú).
source_text: >
  Hey bro, I know it's been a while since I wrote you. This place is a total
  nightmare, but I'm hanging in there. I realize now that I messed everything up,
  and I swear I'm gonna turn over a new leaf when I get out. Tell mom not to worry
  about me — I've only got about eight months left. My homies on the outside keep
  asking about me, but you know how it is. I'm actually doing okay, so don't
  stress. From now on, I'm gonna keep my head down and stay out of trouble. Write
  me back when you can. Take care of yourself, and give my little sister a hug for
  me.
reference_rendering: >
  Oye hermano, sé que ha pasado un buen rato desde que te escribí. Este lugar es
  una pesadilla total, pero ahí la voy llevando. Ahora me doy cuenta de que lo
  eché todo a perder, y te juro que voy a hacer borrón y cuenta nueva cuando
  salga. Dile a mamá que no se preocupe por mí; solo me quedan unos ocho meses.
  Mis carnales de afuera siguen preguntando por mí, pero ya sabes cómo es la cosa.
  En realidad estoy bien, así que no te estreses. De ahora en adelante, voy a
  mantenerme al margen y no meterme en problemas. Escríbeme cuando puedas. Cuídate
  mucho, y dale un abrazo de mi parte a mi hermanita.

