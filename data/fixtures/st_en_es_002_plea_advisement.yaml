id: "st_en_es_002"
source_lang: "en"
target_lang: "es"
# Genre: felony plea / rights advisement. Register: HIGH (formal legal instrument, usted).
source_text: >
  Before this Court accepts your plea of guilty, you must understand the
  following. By pleading guilty, you waive your right to a jury trial and to
  confront the witnesses against you. The maximum penalty for this offense is up
  to five years in state prison and a fine of $10,000. Pursuant to the agreement,
  the prosecutor will recommend probation. You may consult with your attorney
  before answering. If you fail to appear at the sentencing hearing, a warrant
  will be issued for your arrest.
reference_rendering: >
  Antes de que este Tribunal acepte su declaración de culpabilidad, usted debe
  entender lo siguiente. Al declararse culpable, renuncia a su derecho a un
  juicio por jurado y a carearse con los testigos en su contra. La pena máxima
  por este delito es de hasta cinco años en prisión estatal y una multa de diez
  mil dólares. Conforme al acuerdo, el fiscal recomendará libertad condicional.
  Puede consultar con su abogado antes de responder. Si usted no comparece a la
  audiencia de sentencia, se emitirá una orden de arresto.

