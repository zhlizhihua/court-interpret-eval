id: "st_en_es_005"
source_lang: "en"
target_lang: "es"
# Genre: witness statement (first-person narrative). Register: LOW (colloquial lay document).
source_text: >
  I was walking home from work around eleven at night when I saw the whole thing.
  This guy comes out of the bar, totally wasted, and starts yelling 'I'm gonna
  kick your ass' at another dude. Out of nowhere, he flew off the handle and threw
  a punch. I was so embarrassed that I froze and didn't do anything. There were
  maybe four or five people watching. The big guy pulled out a knife, and
  everybody scattered. I called the cops right away, but by the time they showed
  up, the jerk had already taken off. I swear that's exactly what happened.
reference_rendering: >
  Iba caminando a casa desde el trabajo como a las once de la noche cuando vi
  todo. Este tipo sale del bar, bien borracho, y empieza a gritarle 'te voy a
  partir la cara' a otro sujeto. De la nada, perdió los estribos y soltó un
  puñetazo. Estaba tan avergonzado que me quedé congelado y no hice nada. Había
  como cuatro o cinco personas mirando. El tipo grande sacó un cuchillo y todos se
  dispersaron. Llamé a la poli de inmediato, pero para cuando llegaron, el tipo ya
  se había largado. Juro que eso fue exactamente lo que pasó.

