id: "st_en_es_001_draft"
source_lang: "en"
target_lang: "es"
source_text: >
  On the morning of March 3, 2024, the defendant, Mr. Garcia, was arrested and
  charged with two counts of aggravated assault. According to the victim, Garcia
  struck him with a loaded handgun and was caught red-handed at the scene. A
  witness testified that the defendant was 'wasted' at the time. The prosecutor
  will introduce the evidence at trial, and if the jury convicts him, the
  defendant will be sentenced. You have the right to remain silent.
reference_rendering: >
  En la mañana del 3 de marzo de 2024, el acusado, el señor García, fue arrestado
  y acusado de dos cargos de agresión con agravantes. Según la víctima, García lo
  golpeó con una pistola cargada y fue atrapado con las manos en la masa en el
  lugar de los hechos. Un testigo declaró que el acusado estaba 'borracho perdido'
  en ese momento. El fiscal presentará las pruebas en el juicio y, si el jurado lo
  condena, el acusado será sentenciado. Tiene derecho a guardar silencio.

