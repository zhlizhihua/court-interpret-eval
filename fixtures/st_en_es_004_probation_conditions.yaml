id: "st_en_es_004"
source_lang: "en"
target_lang: "es"
# Genre: conditions of probation / sentencing order. Register: HIGH (formal instrument).
source_text: >
  As a condition of your probation, you must comply with the following terms. You
  shall report to your probation officer within forty-eight hours of your
  release. You must maintain gainful employment and may not leave the county
  without prior written permission. You shall not possess or consume any
  controlled substance, and you must submit to random drug testing. You are
  further ordered to attend weekly counseling sessions and to pay restitution in
  the amount of two thousand dollars to the victim. Failure to comply with any of
  these conditions will result in the revocation of your probation.
reference_rendering: >
  Como condición de su libertad condicional, usted debe cumplir con los
  siguientes términos. Deberá presentarse ante su oficial de libertad condicional
  dentro de las cuarenta y ocho horas siguientes a su liberación. Debe mantener
  un empleo remunerado y no podrá salir del condado sin permiso previo por
  escrito. No deberá poseer ni consumir ninguna sustancia controlada, y deberá
  someterse a pruebas de drogas aleatorias. Además, se le ordena asistir a
  sesiones semanales de consejería y pagar una restitución por la cantidad de dos
  mil dólares a la víctima. El incumplimiento de cualquiera de estas condiciones
  resultará en la revocación de su libertad condicional.

