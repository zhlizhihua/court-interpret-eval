id: "st_en_es_007"
source_lang: "en"
target_lang: "es"
# Genre: police incident report. Register: MID (semi-formal bureaucratic; idiom in a quote).
source_text: >
  On the above date, at approximately 22:45 hours, officers responded to a report
  of a disturbance at the listed address. Upon arrival, the officers observed the
  suspect, who appeared to be visibly intoxicated, arguing with the complainant. A
  witness stated that the suspect had 'gone ballistic' and thrown a bottle. During
  a pat-down, the officers recovered a concealed weapon and two grams of a
  controlled substance. The suspect was placed under arrest and advised of his
  Miranda rights. He was subsequently transported to the county jail. The
  complainant declined medical treatment at the scene.
reference_rendering: >
  En la fecha indicada, aproximadamente a las 22:45 horas, los agentes acudieron a
  un reporte de disturbio en la dirección señalada. Al llegar, los agentes
  observaron al sospechoso, quien parecía estar visiblemente ebrio, discutiendo
  con el denunciante. Un testigo declaró que el sospechoso se había puesto como
  loco y había arrojado una botella. Durante un cacheo, los agentes recuperaron un
  arma oculta y dos gramos de una sustancia controlada. El sospechoso fue puesto
  bajo arresto y se le informó de sus derechos Miranda. Posteriormente fue
  trasladado a la cárcel del condado. El denunciante rechazó tratamiento médico en
  el lugar de los hechos.

